fn circle(avoid bool) f32, bool, f32, float3 {
	nav::clear();
	crowd::clear();
	crowd::avoid = avoid;
	for i in 37 {
		let a real = 2.0 * PI * (i as real) / 37.0;
		let x = (7.0 * cos(a)) as f32;
		let z = (7.0 * sin(a)) as f32;
		agent(float3 { x, 0.0, z }, float3 { -x, 0.0, -z });
	}
	var gap f32 = 1000000000.0;
	var fast f32 = 0.0;
	for s in 2400 {
		crowd::step(DT);
		let g = min_gap();
		if g < gap { gap = g; }
		let f = fastest();
		if f > fast { fast = f; }
	}
	var total = float3 { 0.0, 0.0, 0.0 };
	for i in crowd::count() {
		total = total + crowd::pos(i);
	}
	return gap, all_arrived(), fast, total;
}
