fn clearance(p float3) f32 {
	var dx f32 = abs(p.x) - 1.0;
	if dx < 0.0 { dx = 0.0; }
	var dz f32 = abs(p.z) - 1.0;
	if dz < 0.0 { dz = 0.0; }
	flat_len(dx, dz)
}
fn around(mesh bool) f32, bool {
	field();
	crowd::clear();
	crowd::avoid = true;
	crowd::on_mesh = mesh;
	for i in 7 {
		let o f32 = 0.7 * (i as f32);
		agent(float3 { -7.0, 0.0, -2.1 + o }, float3 { 7.0, 0.0, 2.1 - o });
	}
	var near f32 = 1000000000.0;
	for s in 1800 {
		crowd::step(DT);
		for i in crowd::count() {
			let c = clearance(crowd::pos(i));
			if c < near { near = c; }
		}
	}
	let done = all_arrived();
	crowd::on_mesh = true;
	return near, done;
}
fn k3() {
	let near, done = around(true);
	check(near >= 0.15 && done, "K3 routes around a box on the mesh");
	print("K3 clearance ", r3(near), " arrived ", done);
	let cnear, cdone = around(false);
	check(cnear < 0.05, "K3 control: straight lines cut through the box");
}
