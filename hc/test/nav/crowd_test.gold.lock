	quad(float3 { -1.0, 1.0, -1.0 }, float3 { -1.0, 1.0, 1.0 }, float3 { 1.0, 1.0, 1.0 }, float3 { 1.0, 1.0, -1.0 });
	quad(float3 { 1.0, 0.0, -1.0 }, float3 { 1.0, 1.0, -1.0 }, float3 { 1.0, 1.0, 1.0 }, float3 { 1.0, 0.0, 1.0 });
	quad(float3 { -1.0, 0.0, -1.0 }, float3 { -1.0, 0.0, 1.0 }, float3 { -1.0, 1.0, 1.0 }, float3 { -1.0, 1.0, -1.0 });
	quad(float3 { -1.0, 0.0, 1.0 }, float3 { 1.0, 0.0, 1.0 }, float3 { 1.0, 1.0, 1.0 }, float3 { -1.0, 1.0, 1.0 });
	quad(float3 { -1.0, 0.0, -1.0 }, float3 { -1.0, 1.0, -1.0 }, float3 { 1.0, 1.0, -1.0 }, float3 { 1.0, 0.0, -1.0 });
