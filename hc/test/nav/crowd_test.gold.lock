fn flat_len(x f32, z f32) f32 {
	let s real = x * x + z * z;
	sqrt(s) as f32
}
fn min_gap() f32 {
	var best f32 = 1000000000.0;
	let n = crowd::count();
	for i in n {
		let a = crowd::pos(i);
		for j in i + 1..n {
			let b = crowd::pos(j);
			let d = flat_len(a.x - b.x, a.z - b.z);
			if d < best { best = d; }
		}
	}
	best
}
fn fastest() f32 {
	var best f32 = 0.0;
	for i in crowd::count() {
		let v = crowd::vel(i);
		let s = flat_len(v.x, v.z);
		if s > best { best = s; }
	}
	best
}
fn all_arrived() bool {
	for i in crowd::count() {
		if !crowd::arrived(i) { return false; }
	}
	true
}
