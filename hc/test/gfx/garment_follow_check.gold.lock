	let j2x, j2y, j2z = garment::joint(2);
	let j4x, j4y, j4z = garment::joint(4);
	let j5x, j5y, j5z = garment::joint(5);
	let j7x, j7y, j7z = garment::joint(7);
	Q.resize(obj::V.len, 0.0);
	let sn = sin(2.0 * PI * s);
	for v in obj::V.len / 3 {
		let x0 = obj::V[3 * v] as real;
		let y0 = obj::V[3 * v + 1] as real;
		let z0 = obj::V[3 * v + 2] as real;
		let x1, y1, z1 = rot(x0, y0, z0, j5x, j5y, j5z, 0.0, 1.0, 0.0, wf[v] * 0.8 * s);
