		let j = s % (i + 1);
		let held = perm[i];
		perm[i] = perm[j];
		perm[j] = held;
		i -= 1;
	}
	var t = ntri - 1;
	while t >= 1 {
		s = (s * 1103515245 + 12345) % 4294967296;
		let j = s % (t + 1);
		for k in 3 {
			let held = tris[t * 3 + k];
			tris[t * 3 + k] = tris[j * 3 + k];
			tris[j * 3 + k] = held;
		}
		t -= 1;
	}
	var idx int[>..] = [];
	for v in tris {
		idx.push(perm[v]);
	}
	var data byte[>..] = [];
	data.resize(nv * 12, 0);
	for y in 501 {
		for x in 1001 {
			let at = perm[y * 1001 + x] * 12;
			for k in 4 {
				data[at + k] = ((x >> (8 * k)) & 255) as byte;
				data[at + 4 + k] = ((y >> (8 * k)) & 255) as byte;
			}
		}
	}
	var out int[>..] = [];
	var remap int[>..] = [];
	var moved byte[>..] = [];
	var enc_tri byte[>..] = [];
	var enc_vert byte[>..] = [];
	let t0 = clock_ns();
	let used = meshpack::optimize(idx, nv, out, remap);
	let t1 = clock_ns();
	meshpack::remap_bytes(data, 12, remap, used, moved);
	let t2 = clock_ns();
	meshpack::encode_triangles(out, enc_tri);
	let t3 = clock_ns();
	meshpack::encode_attributes(moved, used, 12, enc_vert);
	let t4 = clock_ns();
	let ms_opt = ((t1 - t0) as real) / 1000000.0;
	let ms_remap = ((t2 - t1) as real) / 1000000.0;
	let ms_tri = ((t3 - t2) as real) / 1000000.0;
	let ms_vert = ((t4 - t3) as real) / 1000000.0;
	let total = ms_opt + ms_remap + ms_tri + ms_vert;
	let bpt = (enc_tri.len as real) / (ntri as real);
	let bpv = (enc_vert.len as real) / (used as real);
	print("P8 ms optimize ", r3(ms_opt), " remap ", r3(ms_remap), " triangles ", r3(ms_tri), " attributes ", r3(ms_vert), " total ", r3(total), " bytes a triangle ", r3(bpt), " bytes a vertex ", r3(bpv));
	var det byte[>..] = [];
	format(det, r3(total), " ms");
	check(total < 700.0, "P8 1M triangles packed under 700 ms", det);
}
