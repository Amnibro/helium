fn load(path const byte[:]) Rec[>..] {
	var recs Rec[>..] = [];
	var data byte[>..] = [];
	read_file(path, data);
	var at = 0;
	while at < data.len {
		var whole = at + 16 <= data.len;
		var starts int[3] = [0; 3];
		var lens int[3] = [0; 3];
		var p = at + 16;
		for k in 3 {
			if whole {
				if p + 4 > data.len {
					whole = false;
				} else {
					let n = u32at(data, p);
					if p + 4 + n > data.len {
						whole = false;
					} else {
						starts[k] = p + 4;
						lens[k] = n;
						p += 4 + n;
					}
				}
			}
		}
		if !whole {
			print("FAIL cases file is whole");
			break;
		}
		recs.push(Rec { kind: u32at(data, at), count: u32at(data, at + 4), size: u32at(data, at + 8), flag: u32at(data, at + 12), input: copy(data[starts[0]..starts[0] + lens[0]]), extra: copy(data[starts[1]..starts[1] + lens[1]]), refb: copy(data[starts[2]..starts[2] + lens[2]]) });
		at = p;
	}
	recs
}
