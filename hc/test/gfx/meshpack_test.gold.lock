fn tri_keys(idx const int[:], nv int) int[>..] {
	var keys int[>..] = [];
	for t in idx.len / 3 {
		var c int[>..] = [];
		canon(idx, t, c);
		keys.push(c[0] * nv * nv + c[1] * nv + c[2]);
	}
