fn encode_rec(r Rec&, out byte[>..]&) {
	if r.kind == 0 {
		meshpack::encode_attributes(r.input, r.count, r.size, out);
	} else if r.kind == 1 {
		let tri = ints(r.extra, 4);
		meshpack::encode_triangles(tri, out);
	} else {
		let seq = ints(r.input, 4);
		meshpack::encode_sequence(seq, out);
	}
}
fn wanted(r Rec&) byte[>..] {
	var out byte[>..] = [];
	if r.kind == 0 {
		out.append(r.input);
	} else if r.kind == 1 {
		let tri = ints(r.extra, 4);
		let packed = bytes_of(tri, r.size);
		out.append(packed);
	} else {
		let seq = ints(r.input, 4);
		let packed = bytes_of(seq, r.size);
		out.append(packed);
	}
	out
}
fn round_trip(r Rec&, stream const byte[:]) bool {
	var got byte[>..] = [];
	if !meshopt::decode(stream, r.count, r.size, r.kind, 0, got) {
		return false;
	}
	let want = wanted(r);
	if r.kind == 1 {
		let a = ints(got, r.size);
		let b = ints(want, r.size);
		return same_tris(a, b);
	}
	return got == want;
}
