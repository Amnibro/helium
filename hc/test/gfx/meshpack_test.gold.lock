	var tris int[>..] = [];
	for y in 500 {
		for x in 1000 {
			let a = y * 1001 + x;
			let b = a + 1;
			let c = a + 1001;
			let d = c + 1;
			tris.push(a);
			tris.push(b);
			tris.push(d);
			tris.push(a);
			tris.push(d);
			tris.push(c);
		}
	}
