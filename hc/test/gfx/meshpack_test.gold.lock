fn canon(idx const int[:], t int, out int[>..]&) {
	let a = idx[t * 3];
	let b = idx[t * 3 + 1];
	let c = idx[t * 3 + 2];
	if a <= b && a <= c {
		out.push(a);
		out.push(b);
		out.push(c);
	} else if b <= c {
		out.push(b);
		out.push(c);
		out.push(a);
	} else {
		out.push(c);
		out.push(a);
		out.push(b);
	}
}
fn same_tris(a const int[:], b const int[:]) bool {
