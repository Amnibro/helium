import os;
fn p1_p2_p7(recs Rec[>..]&, dump const byte[:]) {
	var total = 0;
	var p1 = 0;
	var p2 = 0;
	var ours = 0;
	var theirs = 0;
	var damaged = 0;
	var failed = 0;
	var bad = -1;
	var bad_kind = 0;
	var bad_count = 0;
	var bad_size = 0;
	var dumped byte[>..] = [];
	for &r in recs {
		var stream byte[>..] = [];
		encode_rec(r, stream);
		if round_trip(r, stream) {
			p1 += 1;
		} else if bad < 0 {
			bad = total;
			bad_kind = r.kind;
			bad_count = r.count;
			bad_size = r.size;
		}
		if r.kind == 1 {
			if stream.len <= r.refb.len {
				p2 += 1;
			}
			ours += stream.len;
			theirs += r.refb.len;
		} else if stream == r.refb {
			p2 += 1;
		}
		if dump.len > 0 {
			let want = wanted(r);
			put(dumped, r.kind, 4);
			put(dumped, r.count, 4);
			put(dumped, r.size, 4);
			put(dumped, stream.len, 4);
			dumped.append(stream);
			put(dumped, want.len, 4);
			dumped.append(want);
		}
		if r.count > 0 {
			damaged += 1;
			if stream.len > 1 {
				stream[1] = stream[1] ^ 255;
				if !round_trip(r, stream) {
					failed += 1;
				}
			}
		}
		total += 1;
	}
	var d1 byte[>..] = [];
	format(d1, p1, " of ", total);
	if bad >= 0 {
		format(d1, ", first failure record ", bad, " kind ", bad_kind, " count ", bad_count, " size ", bad_size);
	}
	check(p1 == total, "P1 round trip", d1);
	var d2 byte[>..] = [];
	format(d2, p2, " of ", total, ", triangle bytes ", ours, " vs ", theirs);
	check(p2 == total, "P2 reference parity", d2);
	var d7 byte[>..] = [];
	format(d7, failed, " of ", damaged);
	check(failed == damaged, "P7 damaged streams fail", d7);
	if dump.len > 0 {
		let wrote = write_file(dump, dumped);
		check(wrote, "P3 streams written", dump);
	}
}
