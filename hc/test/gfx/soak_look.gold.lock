fn lum(px const byte[:]) real, real {
	var ls real[>..] = [];
	var sum = 0.0;
	for row in 160..560 {
		for col in 440..840 {
			let o = (row * 1280 + col) * 8;
			let l = 0.2126 * half(px[o], px[o + 1]) + 0.7152 * half(px[o + 2], px[o + 3]) + 0.0722 * half(px[o + 4], px[o + 5]);
			ls.push(l);
			sum += l;
		}
	}
	sort(ls) { a, b => a > b };
	var top = 0.0;
	let k = ls.len / 100;
	for i in k { top += ls[i]; }
	return sum / (ls.len as real), top / (k as real);
}
