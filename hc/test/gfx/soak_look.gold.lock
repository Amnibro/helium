fn half(lo byte, hi byte) real {
	let h = ((hi as int) << 8) | (lo as int);
	let e = (h >> 10) & 31;
	let f = h & 1023;
	var v = 0.0;
	if e == 0 {
		v = (f as real) * pow(2.0, -24.0);
	} else if e == 31 {
		v = 65504.0;
	} else {
		v = (1024 + f) as real * pow(2.0, (e - 25) as real);
	}
	if ((h >> 15) & 1) == 1 { -v } else { v }
}
