fn clearance() real {
	var best = 1.0e30;
	let nv = garment::pos.len / 3;
	for v in nv {
		if !garment::held[v] {
			let dx = (garment::pos[v * 3] - garment::anchor[v * 3]) as real;
			let dy = (garment::pos[v * 3 + 1] - garment::anchor[v * 3 + 1]) as real;
			let dz = (garment::pos[v * 3 + 2] - garment::anchor[v * 3 + 2]) as real;
			let d = dx * garment::anchor_n[v * 3] + dy * garment::anchor_n[v * 3 + 1] + dz * garment::anchor_n[v * 3 + 2];
			if d < best { best = d; }
		}
	}
	best * garment::S.unit
}
