fn loops() int, int {
	let nv = garment::pos.len / 3;
	var head = dictionary<int, int> {};
	var ent_v int[>..] = [];
	var ent_n int[>..] = [];
	var wid int[>..] = [];
	for v in nv {
		let x = garment::pos[v * 3];
		let y = garment::pos[v * 3 + 1];
		let z = garment::pos[v * 3 + 2];
		let k = wkey(x, y, z);
		var first = -1;
		let h = head.get(k);
		if h { first = h; }
		var e = first;
		var found = -1;
		while e >= 0 && found < 0 {
			let u = ent_v[e];
			if garment::pos[u * 3] == x && garment::pos[u * 3 + 1] == y && garment::pos[u * 3 + 2] == z {
				found = u;
			} else {
				e = ent_n[e];
			}
		}
		if found >= 0 {
			wid.push(found);
		} else {
			wid.push(v);
			ent_v.push(v);
			ent_n.push(first);
			head.insert(k, ent_v.len - 1);
		}
	}
	var cnt = dictionary<int, int> {};
	for t in ntri() {
		let a, b, c = tri(t);
		let w0 = wid[a];
		let w1 = wid[b];
		let w2 = wid[c];
		add_edge(cnt, w0, w1, nv);
		add_edge(cnt, w1, w2, nv);
		add_edge(cnt, w2, w0, nv);
	}
	var mx = 0;
	var ea int[>..] = [];
	var eb int[>..] = [];
	each(cnt) { k, v =>
		if v > mx { mx = v; }
		if v == 1 {
			ea.push(k / nv);
			eb.push(k % nv);
		}
	};
	var par int[>..] = [];
	for i in nv { par.push(i); }
	for i in ea.len {
		let ra = uf_find(par, ea[i]);
		let rb = uf_find(par, eb[i]);
		if ra != rb { par[ra] = rb; }
	}
	var seen int[>..] = [];
	seen.resize(nv, 0);
	var nloops = 0;
	for i in ea.len {
		let ra = uf_find(par, ea[i]);
		if seen[ra] == 0 {
			seen[ra] = 1;
			nloops += 1;
		}
		let rb = uf_find(par, eb[i]);
		if seen[rb] == 0 {
			seen[rb] = 1;
			nloops += 1;
		}
	}
	return mx, nloops;
}
