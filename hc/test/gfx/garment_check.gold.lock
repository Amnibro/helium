			ea.push(k / nv);
			eb.push(k % nv);
		}
	};
	var par int[>..] = [];
	for i in nv { par.push(i); }
	for i in ea.len {
		let ra = uf_find(par, ea[i]);
		let rb = uf_find(par, eb[i]);
		if ra != rb { par[ra] = rb; }
	}
	var seen int[>..] = [];
	seen.resize(nv, 0);
	var nloops = 0;
	for i in ea.len {
		let ra = uf_find(par, ea[i]);
		if seen[ra] == 0 {
			seen[ra] = 1;
			nloops += 1;
		}
		let rb = uf_find(par, eb[i]);
		if seen[rb] == 0 {
			seen[rb] = 1;
			nloops += 1;
		}
	}
	return mx, nloops;
}
