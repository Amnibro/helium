fn tri(t int) int, int, int {
	let nb = garment::body.len / 3;
	if t < nb {
		return garment::body[t * 3] as int, garment::body[t * 3 + 1] as int, garment::body[t * 3 + 2] as int;
	}
	let r = t - nb;
	return garment::rib[r * 3] as int, garment::rib[r * 3 + 1] as int, garment::rib[r * 3 + 2] as int;
}
fn ntri() int {
	(garment::body.len + garment::rib.len) / 3
}
