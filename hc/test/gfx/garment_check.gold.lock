	for t in ntri() {
		let a, b, c = tri(t);
		let w0 = wid[a];
		let w1 = wid[b];
		let w2 = wid[c];
		add_edge(cnt, w0, w1, nv);
		add_edge(cnt, w1, w2, nv);
		add_edge(cnt, w2, w0, nv);
	}
	var mx = 0;
	var ea int[>..] = [];
	var eb int[>..] = [];
	each(cnt) { k, v =>
