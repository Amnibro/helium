fn pos_edge(a int, b int) real {
	let dx = (garment::pos[a * 3] - garment::pos[b * 3]) as real;
	let dy = (garment::pos[a * 3 + 1] - garment::pos[b * 3 + 1]) as real;
	let dz = (garment::pos[a * 3 + 2] - garment::pos[b * 3 + 2]) as real;
	sqrt(dx * dx + dy * dy + dz * dz) * garment::S.unit
}
fn uv_edge(a int, b int, scale real) real {
	let du = (garment::uv[a * 2] - garment::uv[b * 2]) as real * scale;
	let dv = (garment::uv[a * 2 + 1] - garment::uv[b * 2 + 1]) as real;
	sqrt(du * du + dv * dv)
}
fn uv_bad(scale real) real {
	let n = ntri();
	if n == 0 { return 0.0; }
	var bad = 0;
	for t in n {
		let a, b, c = tri(t);
		let sp = max(pos_edge(a, b), max(pos_edge(b, c), pos_edge(c, a)));
		let su = max(uv_edge(a, b, scale), max(uv_edge(b, c, scale), uv_edge(c, a, scale)));
		if su < 0.3 * sp || su > 2.5 * sp { bad += 1; }
	}
	bad as real / n as real
}
