fn hyp2(a real, b real) real {
	sqrt(a * a + b * b)
}
fn tri_stretch(a int, b int, c int, scale real) real {
	let u = garment::S.unit;
	let p0x = garment::pos[a * 3] as real * u;
	let p0y = garment::pos[a * 3 + 1] as real * u;
	let p0z = garment::pos[a * 3 + 2] as real * u;
	let e1x = garment::pos[b * 3] as real * u - p0x;
	let e1y = garment::pos[b * 3 + 1] as real * u - p0y;
	let e1z = garment::pos[b * 3 + 2] as real * u - p0z;
	let e2x = garment::pos[c * 3] as real * u - p0x;
	let e2y = garment::pos[c * 3 + 1] as real * u - p0y;
	let e2z = garment::pos[c * 3 + 2] as real * u - p0z;
	let len1 = sqrt(e1x * e1x + e1y * e1y + e1z * e1z);
	if len1 < 1.0e-12 { return 1.0e9; }
	let xx = e1x / len1;
	let xy = e1y / len1;
	let xz = e1z / len1;
	let bx = e2x * xx + e2y * xy + e2z * xz;
	let px = e2x - bx * xx;
	let py = e2y - bx * xy;
	let pz = e2z - bx * xz;
	let ylen = sqrt(px * px + py * py + pz * pz);
	if ylen < 1.0e-12 { return 1.0e9; }
	let d1u = (garment::uv[b * 2] - garment::uv[a * 2]) as real * scale;
	let d1v = (garment::uv[b * 2 + 1] - garment::uv[a * 2 + 1]) as real;
	let d2u = (garment::uv[c * 2] - garment::uv[a * 2]) as real * scale;
	let d2v = (garment::uv[c * 2 + 1] - garment::uv[a * 2 + 1]) as real;
	let det = len1 * ylen;
	let ja = d1u / len1;
	let jb = (d2u * len1 - d1u * bx) / det;
	let jc = d1v / len1;
	let jd = (d2v * len1 - d1v * bx) / det;
	let h1 = hyp2(ja + jd, jc - jb);
	let h2 = hyp2(ja - jd, jc + jb);
	let s1 = (h1 + h2) / 2.0;
	let s2 = abs((h1 - h2) / 2.0);
	if s2 < 1.0e-12 { return 1.0e9; }
	s1 / s2
}
fn stretch(scale real) real, real {
	let n = ntri();
	if n == 0 { return 0.0, 0.0; }
	var st real[>..] = [];
	var over = 0;
	for t in n {
		let a, b, c = tri(t);
		let s = tri_stretch(a, b, c, scale);
		st.push(s);
		if s > 2.0 { over += 1; }
	}
	sort(st) { a, b => a < b };
	return st[n / 2], over as real / n as real;
}
