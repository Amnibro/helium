fn bits_of(x f32) int {
	let a f32[1] = [x];
	let b = bytes_of(a);
	(b[0] as int) | ((b[1] as int) << 8) | ((b[2] as int) << 16) | ((b[3] as int) << 24)
}
fn wkey(x f32, y f32, z f32) int {
	let m u64 = 1000003;
	let bx u64 = bits_of(x) as u64;
	let by u64 = bits_of(y) as u64;
	let bz u64 = bits_of(z) as u64;
	(bx * m * m + by * m + bz) as! int
}
