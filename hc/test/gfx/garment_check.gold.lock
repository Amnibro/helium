fn loops() int, int {
	let nv = garment::pos.len / 3;
	var head = dictionary<int, int> {};
	var ent_v int[>..] = [];
	var ent_n int[>..] = [];
	var wid int[>..] = [];
	for v in nv {
		let x = garment::pos[v * 3];
		let y = garment::pos[v * 3 + 1];
		let z = garment::pos[v * 3 + 2];
		let k = wkey(x, y, z);
		var first = -1;
		let h = head.get(k);
		if h { first = h; }
		var e = first;
		var found = -1;
		while e >= 0 && found < 0 {
			let u = ent_v[e];
			if garment::pos[u * 3] == x && garment::pos[u * 3 + 1] == y && garment::pos[u * 3 + 2] == z {
				found = u;
			} else {
				e = ent_n[e];
			}
		}
		if found >= 0 {
			wid.push(found);
		} else {
			wid.push(v);
			ent_v.push(v);
			ent_n.push(first);
			head.insert(k, ent_v.len - 1);
		}
	}
