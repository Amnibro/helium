fn main() {
	if arg_count() < 12 {
		print("usage: vis_frame model.glb out.png width height eyex eyey eyez tx ty tz fov_y");
		return;
	}
	let path = arg_of(1);
	let outp = arg_of(2);
	let w, wok = parse_int(arg_of(3));
	let h, hok = parse_int(arg_of(4));
	let eye = float3 { num(arg_of(5)), num(arg_of(6)), num(arg_of(7)) };
	let tgt = float3 { num(arg_of(8)), num(arg_of(9)), num(arg_of(10)) };
	let fov = num(arg_of(11));
	gltf::lazy_pixels = true;
	let id = gltf::load(path);
	if id < 0 {
		print(gltf::error());
		return;
	}
	gfx::open_headless(w, h);
	let inst = s3d::add(id);
	let dx = eye.x - tgt.x;
	let dy = eye.y - tgt.y;
	let dz = eye.z - tgt.z;
	let dist = sqrt((dx * dx + dy * dy + dz * dz) as real) as f32;
	s3d::view = s3d::Camera { eye: eye, target: tgt, up: float3 { 0.0, 1.0, 0.0 }, fov_y: fov, near: dist * 0.01, far: dist * 10.0 };
	s3d::sun.shadows = false;
	s3d::sun.rgb = float3 { 0.0, 0.0, 0.0 };
	s3d::sky = s3d::Sky { zenith: float3 { 0.5, 0.5, 0.5 }, horizon: float3 { 0.5, 0.5, 0.5 }, ground: float3 { 0.5, 0.5, 0.5 }, ambient: 1.0, draw: true };
	s3d::look.curve = 1;
	s3d::look.bloom = 0.0;
	s3d::look.ssao = false;
	s3d::init(w, h);
	let target = gfx::render_target(w, h, gfx::RGBA8);
	for i in 2 { s3d::render(target); }
	let saved = gfx::save_png(target, outp);
	print("vis_frame: ", saved, " ", gfx::driver());
	gfx::close();
}
