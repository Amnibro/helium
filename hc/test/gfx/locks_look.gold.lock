fn spread_ratio(px const byte[:], rad real) real {
	let lim = 0.95 * rad;
	var ls real[>..] = [];
	for y in 720 {
		for x in 1280 {
			let dx real = (x as real) + 0.5 - 640.0;
			let dy real = (y as real) + 0.5 - 360.0;
			if dx * dx + dy * dy <= lim * lim {
				let o = (y * 1280 + x) * 8;
				let r = half(px[o], px[o + 1]);
				let g = half(px[o + 2], px[o + 3]);
				let b = half(px[o + 4], px[o + 5]);
				ls.push(0.2126 * r + 0.7152 * g + 0.0722 * b);
			}
		}
	}
	let n = ls.len;
	if n == 0 { return 0.0; }
	var s real[>..] = copy(ls);
	sort(s) { a, b => a < b };
	let p = s[(0.95 * (n as real)) as int];
	var sw = 0.0;
	var swx = 0.0;
	var swx2 = 0.0;
	var swy = 0.0;
	var swy2 = 0.0;
	var k = 0;
	for y in 720 {
		for x in 1280 {
			let dx real = (x as real) + 0.5 - 640.0;
			let dy real = (y as real) + 0.5 - 360.0;
			if dx * dx + dy * dy <= lim * lim {
				let l = ls[k];
				k += 1;
				if l > p {
					let w = l - p;
					sw += w;
					swx += w * dx;
					swx2 += w * dx * dx;
					swy += w * dy;
					swy2 += w * dy * dy;
				}
			}
		}
	}
	if sw <= 0.0 { return 0.0; }
	let mx = swx / sw;
	let my = swy / sw;
	let vx = max(swx2 / sw - mx * mx, 0.0);
	let vy = max(swy2 / sw - my * my, 0.0);
	let sdx = sqrt(vx);
	let sdy = sqrt(vy);
	if sdy < 1e-9 { return 0.0; }
	sdx / sdy
}
