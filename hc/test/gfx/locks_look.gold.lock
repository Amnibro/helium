fn half(lo byte, hi byte) real {
	let h = (hi as int) * 256 + (lo as int);
	let sg = if h / 32768 == 1 { -1.0 } else { 1.0 };
	let e = (h / 1024) % 32;
	let f = h % 1024;
	if e == 0 {
		sg * (f as real) * pow(2.0, -24.0)
	} else if e == 31 {
		sg * 65504.0
	} else {
		sg * (1024 + f) as real * pow(2.0, (e - 25) as real)
	}
}
