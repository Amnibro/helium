fn covered(a const byte[:], b const byte[:], rad real) real {
	let lim = 0.9 * rad;
	var total = 0;
	var hits = 0;
	for y in 720 {
		for x in 1280 {
			let dx real = (x as real) + 0.5 - 640.0;
			let dy real = (y as real) + 0.5 - 360.0;
			if dx * dx + dy * dy <= lim * lim {
				total += 1;
				let i = (y * 1280 + x) * 4;
				var m = 0;
				for c in 3 {
					let d = abs((a[i + c] as int) - (b[i + c] as int));
					if d > m { m = d; }
				}
				if m > 8 { hits += 1; }
			}
		}
	}
	if total == 0 { return 0.0; }
	(hits as real) / (total as real)
}
