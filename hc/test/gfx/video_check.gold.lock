fn paint(kind int, t int, w int, h int, px byte[>..]&) {
	px.clear();
	var k = kind;
	var swap = false;
	if kind == 4 {
		if t < 5 { k = 1; } else { k = 0; swap = true; }
	}
	var x32 u32 = ((2463534242 + t) as u32);
	fn nxt() int {
		x32 = x32 ^ (x32 << 13);
		x32 = x32 ^ (x32 >> 17);
		x32 = x32 ^ (x32 << 5);
		(x32 % 256) as int
	}
	for y in h {
		for x in w {
			var r = 0;
			var g = 0;
			var b = 0;
			if k == 0 {
				r = 255 * x / w;
				g = 255 * y / h;
				b = (x + 2 * y) % 256 / 2 + 64;
				if swap {
					let tmp = r;
					r = b;
					b = tmp;
				}
			} else if k == 1 {
				let u = x + 3 * t;
				let v = y + 200 - 2 * t;
				r = (u * 4) % 256;
				g = (v * 3) % 256;
				b = if (u / 8 + v / 8) % 2 == 0 { 230 } else { 30 };
			} else if k == 2 {
				let dx = x - w / 2;
				let dy = y - h / 2;
				let rad = 6 + 3 * t;
				if dx * dx + dy * dy < rad * rad {
					r = 250;
					g = (40 + 20 * t) % 256;
					b = 40;
				} else {
					r = 20;
					g = x * 255 / w;
					b = y * 255 / h;
				}
			} else if k == 3 {
				r = nxt();
				g = nxt();
				b = nxt();
			} else {
				let v = if (x + y + t) % 4 < 2 { 255 } else { 0 };
				r = v;
				g = v;
				b = v;
			}
			px.push(r as byte);
			px.push(g as byte);
			px.push(b as byte);
			px.push(255 as byte);
		}
	}
}
