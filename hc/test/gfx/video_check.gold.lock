var last byte[>..];
fn ffmpeg_same(path const byte[:], w int, h int, frames int) bool {
	last.clear();
	var cmd byte[>..] = [];
	format(cmd, "ffmpeg -nostdin -v error -i ", path, " -f rawvideo -pix_fmt yuv420p -y ", path, ".yuv 2> ", path, ".err");
	let rc = run_command(cmd);
	if rc != 0 {
		last.append("ffmpeg exit");
		return false;
	}
	var ename byte[>..] = [];
	format(ename, path, ".err");
	var err byte[>..] = [];
	let eok = read_file(ename, err);
	if !eok || err.len > 0 {
		last.append("ffmpeg said: ");
		last.append(err[..min(err.len, 200)]);
		return false;
	}
	var yname byte[>..] = [];
	format(yname, path, ".yuv");
	var yuv byte[>..] = [];
	let yok = read_file(yname, yuv);
	let expected = frames * (w * h + 2 * (w / 2) * (h / 2));
	if !yok || yuv.len != expected || yuv.len != video::recon.len {
		last.append("length");
		return false;
	}
	for i in yuv.len {
		if yuv[i] != video::recon[i] {
			format(last, "byte ", i);
			return false;
		}
	}
	true
}
