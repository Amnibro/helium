fn v4() {
	let w = 1280;
	let h = 720;
	let frames = 30;
	video::keep_recon = true;
	video::recon.clear();
	var ok = video::start(w, h, 30, 26, 30);
	var total = 0;
	var px byte[>..] = [];
	if ok {
		for t in frames {
			paint(1, t, w, h, px);
			let t0 = clock_ns();
			let r = video::add(px);
			total += clock_ns() - t0;
			if !r {
				ok = false;
				break;
			}
		}
	}
	var path byte[>..] = [];
	format(path, work, "/video_speed.mp4");
	if ok { ok = video::save(path); }
	var same = false;
	if ok { same = ffmpeg_same(path, w, h, frames); }
	let fps = if total > 0 { frames * 1.0e9 / total } else { 0.0 };
	var detail byte[>..] = [];
	if !ok {
		format(detail, video::error());
	} else {
		var data byte[>..] = [];
		var size = 0;
		if read_file(path, data) { size = data.len; }
		format_flt(detail, fps, 1);
		format(detail, " fps, ", size / 1024, " KB");
		if !same { format(detail, ", ", last); }
	}
	check("V4 speed 1280x720", same && fps > 10.0, detail);
}
