	first_sz.clear();
	rest_max.clear();
	for i in cases.len {
		let c = cases[i];
		var name byte[>..] = [];
		format(name, "V1 ", c.name);
		var path byte[>..] = [];
		format(path, work, "/video_", i, ".mp4");
		video::keep_recon = true;
		video::recon.clear();
		var ok = video::start(c.w, c.h, 30, c.qp, c.gop);
		var sum = 0.0;
		var first = 0;
		var rest = 0;
		var px byte[>..] = [];
		if ok {
			for t in c.frames {
				paint(c.kind, t, c.w, c.h, px);
				if !video::add(px) {
					ok = false;
					break;
				}
				sum += video::psnr_y();
				let fb = video::frame_bytes(t);
				if t == 0 { first = fb; } else { rest = max(rest, fb); }
			}
		}
		if ok { ok = video::save(path); }
		var pass = false;
		if ok { pass = ffmpeg_same(path, c.w, c.h, c.frames); }
		let avg = sum / c.frames;
		avgs.push(avg);
		first_sz.push(first);
		rest_max.push(rest);
		var detail byte[>..] = [];
		if pass {
			var data byte[>..] = [];
			var size = 0;
			if read_file(path, data) { size = data.len; }
			format(detail, size, " bytes, ");
			format_flt(detail, avg, 1);
			format(detail, " dB");
		} else if !ok {
			format(detail, video::error());
		} else {
			format(detail, last);
		}
		check(name, pass, detail);
	}
}
