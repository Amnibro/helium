fn skin_d(c real, s real) real {
	if s < 0.0001 { return max(c, 0.0); }
	var num = 0.0;
	var den = 0.0;
	for i in 4096 {
		let a = PI * (i + 0.5) / 4096.0;
		let h = sin(a / 2.0);
		let x = 2.0 * h / s;
		let k = (exp(-x) + exp(-x / 3.0)) / max(h, 1e-9) * sin(a);
		let p = cos(a) * c;
		let q = sin(a) * sqrt(max(1.0 - c * c, 0.0));
		let e = if p >= q { p } else if p <= -q { 0.0 } else { (p * acos(-p / q) + sqrt(q * q - p * p)) / PI };
		num += k * e;
		den += k;
	}
	num / den
}
