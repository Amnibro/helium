import math;
fn main() {
	print("// generated by hc/test/gfx/tools/make_sheen_lut.amni");
	print("const int SHEEN_N = 16;");
	print("const float SHEEN_E[256] = float[](");
	let nt = 180;
	let np = 360;
	let dt = PI * 0.5 / 180.0;
	let dp = 2.0 * PI / 360.0;
	for j in 16 {
		var line byte[>..] = [];
		line.append("    ");
		let r = max(j as real / 15.0, 0.07);
		let ia = 1.0 / (r * r);
		for i in 16 {
			let nv = max(i as real / 15.0, 0.001);
			let vx = sqrt(1.0 - nv * nv);
			var sum = 0.0;
			for a in nt {
				let th = (a as real + 0.5) * dt;
				let st = sin(th);
				let ct = cos(th);
				let vis = min(1.0 / (4.0 * (ct + nv - ct * nv)), 1.0);
				for b in np {
					let ph = (b as real + 0.5) * dp;
					let lx = st * cos(ph);
					let ly = st * sin(ph);
					let hx = vx + lx;
					let hy = ly;
					let hz = nv + ct;
					let hl = sqrt(hx * hx + hy * hy + hz * hz);
					let hzn = hz / hl;
					let d = (2.0 + ia) * pow(max(1.0 - hzn * hzn, 0.0), 0.5 * ia) / (2.0 * PI);
					sum += d * vis * ct * st * dt * dp;
				}
			}
			let v = min(sum, 0.99999);
			let q = round(v * 100000.0) as int;
			line.append("0.");
			var dv = 10000;
			while dv > 0 {
				line.push(('0' + q / dv % 10) as! byte);
				dv /= 10;
			}
			if i < 15 {
				line.append(", ");
			}
		}
		if j < 15 {
			line.push(',');
		}
		print(line);
	}
	print(");");
}
