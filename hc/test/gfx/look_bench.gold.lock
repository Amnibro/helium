fn features(f const byte[:]) {
	if has(f, "pcss") {
		s3d::sun.angle = 0.07;
		s3d::sun.reach = 1.0;
	}
	if has(f, "wide") { s3d::sun.angle = 0.17; }
	if has(f, "fit") { s3d::sun.fit = true; }
	if has(f, "taa") { s3d::temporal = 1; }
	if has(f, "noao") { s3d::look.ssao = false; }
	if has(f, "gtao") { s3d::ao_mode = 1; }
	if has(f, "contact") { s3d::sun.contact = 0.07; }
	if has(f, "local") {
		for k in 2 {
			s3d::lights[k].kind = 1;
			s3d::lights[k].dir = linalg::unit3(float3 { 0.0, 0.9, 0.0 } - s3d::lights[k].pos);
			s3d::lights[k].cone = 0.08;
			s3d::lights[k].shadows = true;
		}
	}
	if has(f, "point") {
		s3d::lights[0].shadows = true;
		s3d::lights[1].shadows = true;
	}
	if has(f, "direct") { s3d::debug_view = 5; }
	if has(f, "noshadow") { s3d::sun.shadows = false; }
	if has(f, "hires") { s3d::sun.map_size = 8192; }
	if has(f, "sunonly") {
		s3d::lights.clear();
		s3d::sky.ambient = 0.0;
	}
	if has(f, "soft") { s3d::studio_soft(float3 { 0.8, 0.81, 0.84 }, 2.0); }
	if has(f, "expo") { s3d::look.auto_exposure = true; }
	if has(f, "bright") {
		let four = float3 { 4.0, 4.0, 4.0 };
		s3d::sun.rgb = s3d::sun.rgb * four;
		for &l in s3d::lights { l.rgb = l.rgb * four; }
	}
	if has(f, "dof") {
		let d = s3d::view.eye - s3d::view.target;
		s3d::dof_aperture = 0.004;
		s3d::dof_focus = sqrt((d.x * d.x + d.y * d.y + d.z * d.z) as real) as f32;
	}
	if has(f, "mblur") { s3d::motion_blur = 0.5; }
	if has(f, "many8") { many(8); }
	if has(f, "many64") { many(64); }
	if has(f, "many512") { many(512); }
	if has(f, "lut") {
		warm_lut();
		s3d::look.lut = 1.0;
	}
	if has(f, "idlut") { s3d::look.lut = 1.0; }
	if has(f, "noso") { s3d::spec_occlusion = false; }
	if has(f, "ssr") { s3d::ssr_on = true; }
	if has(f, "dbgso") { s3d::debug_view = 9; }
	if has(f, "dbgssr") { s3d::debug_view = 10; }
	if has(f, "ambient") { s3d::debug_view = 4; }
}
