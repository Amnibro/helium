fn warm_lut() {
	var px byte[>..] = [];
	for bi in 17 {
		for gi in 17 {
			for ri in 17 {
				let r = ri as real / 16.0;
				let g = gi as real / 16.0;
				let b = bi as real / 16.0;
				let r2 = min(1.0, r * 1.06 + 0.02);
				let g2 = g;
				let b2 = b * 0.88 + 0.03;
				px.push(floor(r2 * 255.0 + 0.5) as byte);
				px.push(floor(g2 * 255.0 + 0.5) as byte);
				px.push(floor(b2 * 255.0 + 0.5) as byte);
				px.push(255);
			}
		}
	}
	s3d::set_lut(px[..], 17);
}
