fn gpu_ns(path const byte[:], ns real[>..]&) {
	ns.clear();
	var data byte[>..] = [];
	guard read_file(path, data) else { return; }
	let lines = split(data[..], '\n');
	for line in lines {
		if starts_with(line, "submit") {
			let fields = words(line);
			var last const byte[:] = "";
			for f in fields { last = f; }
			let n, ok = parse_int(last);
			if ok { ns.push(n); }
		}
	}
}
