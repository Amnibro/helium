fn orbit(k int) {
	if !have_eye0 {
		eye0 = s3d::view.eye;
		have_eye0 = true;
	}
	let t = s3d::view.target;
	let dx = eye0.x - t.x;
	let dz = eye0.z - t.z;
	let a = 0.03 * k;
	let c = cos(a) as f32;
	let s = sin(a) as f32;
	s3d::view.eye = float3 { t.x + dx * c + dz * s, eye0.y, t.z - dx * s + dz * c };
}
