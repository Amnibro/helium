fn main() {
	let a = args();
	let w = num(a[3]) as int;
	let h = num(a[4]) as int;
	gltf::lazy_pixels = true;
	if !gfx::open_headless(w, h) {
		print("look_bench: no device: ", gfx::error());
		return;
	}
	let asset = gltf::load(a[1]);
	if asset < 0 {
		print("look_bench: load failed");
		return;
	}
	let it = s3d::add(asset);
	s3d::place(it, gfx::mat4_identity);
	if a.len > 14 && a[14] == "floor" {
		var fm = shapes::material(float3 { 0.55, 0.55, 0.56 }, 0.0, 0.9);
		fm.no_shadow = true;
		let fl = s3d::add(shapes::plane(3.0, fm));
		s3d::place(fl, gfx::mat4_identity);
	}
	let eye = float3 { num(a[5]) as f32, num(a[6]) as f32, num(a[7]) as f32 };
	let target = float3 { num(a[8]) as f32, num(a[9]) as f32, num(a[10]) as f32 };
	s3d::view = s3d::Camera { eye: eye, target: target, up: float3 { 0.0, 1.0, 0.0 }, fov_y: num(a[11]) as f32, near: 0.05, far: 100.0 };
	studio();
	features(a[12]);
	s3d::init(w, h);
	let out = gfx::render_target(w, h, gfx::RGBA8);
	let frames = if s3d::temporal != 0 { 48 } else { 3 };
	for i in frames {
		s3d::render(out);
		gfx::flush();
	}
	if has(a[12], "info") {
		print("look_bench: cascades live ", s3d::cascade_live, " ends ", s3d::cascade_end[0], " ", s3d::cascade_end[1], " ", s3d::cascade_end[2]);
	}
	if a[2] != "-" {
		gfx::save_png(out, a[2]);
		print("saved ", a[2]);
	}
	let n = num(a[13]) as int;
	if n > 0 {
		for i in 30 {
			s3d::render(out);
			gfx::flush();
		}
		var log byte[>..] = [];
		env("HELIUM_GPUTIME", log);
		let have_log = log.len > 0;
		var before real[>..] = [];
		var first = 0;
		if have_log {
			gpu_ns(log[..], before);
			first = before.len;
		}
		var wall real[>..] = [];
		for i in n {
			let t = gfx::time();
			s3d::render(out);
			gfx::flush();
			wall.push((gfx::time() - t) * 1000.0);
		}
		print("look_bench: ", a[12], " wall ms median ", median(copy(wall)), " p95 ", p95(copy(wall)));
		if have_log {
			var all real[>..] = [];
			gpu_ns(log[..], all);
			let k = all.len - first;
			if k == 0 || k % n != 0 {
				print("look_bench: gpu submits cannot be split");
			} else {
				let per = k / n;
				var each real[>..] = [];
				for f in n {
					var s = 0.0;
					for j in per { s += all[first + f * per + j]; }
					each.push(s / 1e6);
				}
				print("look_bench: ", a[12], " gpu ms median ", median(copy(each)), " p95 ", p95(copy(each)), " (", per, " submits/frame)");
			}
		}
	}
