fn brute(tri const f32[:], n int, ox real, oy real, oz real, dx real, dy real, dz real, tmax real) real, int {
	var best = tmax;
	var bi = -1;
	for t in n {
		let b = t * 9;
		let v0x = tri[b] as real;
		let v0y = tri[b + 1] as real;
		let v0z = tri[b + 2] as real;
		let e1x = (tri[b + 3] as real) - v0x;
		let e1y = (tri[b + 4] as real) - v0y;
		let e1z = (tri[b + 5] as real) - v0z;
		let e2x = (tri[b + 6] as real) - v0x;
		let e2y = (tri[b + 7] as real) - v0y;
		let e2z = (tri[b + 8] as real) - v0z;
		let px = dy * e2z - dz * e2y;
		let py = dz * e2x - dx * e2z;
		let pz = dx * e2y - dy * e2x;
		let det = e1x * px + e1y * py + e1z * pz;
		if abs(det) < 1e-12 { continue; }
		let inv = 1.0 / det;
		let sx = ox - v0x;
		let sy = oy - v0y;
		let sz = oz - v0z;
		let u = (sx * px + sy * py + sz * pz) * inv;
		if u < 0.0 || u > 1.0 { continue; }
		let qx = sy * e1z - sz * e1y;
		let qy = sz * e1x - sx * e1z;
		let qz = sx * e1y - sy * e1x;
		let v = (dx * qx + dy * qy + dz * qz) * inv;
		if v < 0.0 || u + v > 1.0 { continue; }
		let tt = (e2x * qx + e2y * qy + e2z * qz) * inv;
		if tt > 1e-6 && tt < best {
			best = tt;
			bi = t;
		}
	}
	return best, bi;
}
fn d1() bool {
