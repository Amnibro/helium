		(st >> 40) as real / 16777216.0
	}
	for i in total_rays {
		let ox = -1.9 + 3.8 * rnd();
		let oy = 0.05 + 2.35 * rnd();
		let oz = -1.9 + 3.8 * rnd();
		let z = 2.0 * rnd() - 1.0;
		let a = TAU * rnd();
		let r = sqrt(max(0.0, 1.0 - z * z));
		let dx = r * cos(a);
		let dy = r * sin(a);
		let dz = z;
		let hd, hi = rt::hit(ox as f32, oy as f32, oz as f32, dx as f32, dy as f32, dz as f32, tmax as f32);
		let bd, bi = brute(rt::tri_in, n, ox, oy, oz, dx, dy, dz, tmax);
		if hi < 0 && bi < 0 {
			agree += 1;
		} else if hi >= 0 && bi >= 0 && abs((hd as real) - bd) <= 1e-4 {
			agree += 1;
		}
	}
	let share = 100.0 * (agree as real) / (total_rays as real);
	let ok = b1 == b0 && f1 >= f0 + 3 && agree * 1000 >= total_rays * 999;
	report(ok, "D1 refit matches brute force", str(fx(share, 2), "% agree, ", f1 - f0, " refits"));
