fn parse_cases() bool {
	let n = cases.len;
	var p = 0;
	while p < n {
		if p + 4 > n { return false; }
		let nl = u32at(cases, p);
		let name_at = p + 4;
		p = name_at + nl;
		if p + 4 > n { return false; }
		let sl = u32at(cases, p);
		let s_at = p + 4;
		p = s_at + sl;
		if p + 8 > n { return false; }
		let pts = u32at(cases, p);
		let fc = u32at(cases, p + 4);
		let f_at = p + 8;
		p = f_at + fc * 12;
		if p + 4 > n { return false; }
		let na = u32at(cases, p);
		let a_at = p + 4;
		p = a_at;
		for _a in na {
			if p + 16 > n { return false; }
			let bl = u32at(cases, p + 12);
			p += 16 + bl;
			if p > n { return false; }
		}
		r_name_at.push(name_at);
		r_name_len.push(nl);
		r_s_at.push(s_at);
		r_s_len.push(sl);
		r_pts.push(pts);
		r_faces.push(fc);
		r_f_at.push(f_at);
		r_natt.push(na);
		r_a_at.push(a_at);
		r_kind.push(kind_of(s_at, sl));
	}
	return true;
}
fn load_cases() bool {
	cases_path.clear();
	if arg_count() > 1 {
		arg(1, cases_path);
	} else {
		cases_path.append("hc/test/gfx/fixtures/draco_cases.bin");
	}
	cases.clear();
	if !read_file(cases_path, cases) {
		check("cases file", false, cases_path);
		return false;
	}
	check("cases file is whole", parse_cases(), "");
	return true;
}
