fn v4() {
	let cs = cases();
	var idx = 0;
	for c, i in cs {
		if c.name == "v_st48hi" { idx = i; }
	}
	var best = 0;
	var first = true;
	var frames = 0;
	for r in 7 {
		var pcm f32[>..] = [];
		let t0 = ns();
		let ch, rate, ok = codec_vorbis::decode(file(idx), pcm);
		let t1 = ns();
		if !ok {
			report(false, "speed", codec_vorbis::error());
			return;
		}
		let dt = t1 - t0;
		if first || dt < best {
			best = dt;
			first = false;
		}
		if ch > 0 { frames = pcm.len / ch; }
	}
	let secs = max(best, 1) / 1000000000.0;
	let speed = (frames / 48000.0) / secs;
	let ms = max(best, 1) / 1000000.0;
	var detail byte[>..] = [];
	format_flt(detail, ms, 2);
	format(detail, " ms, ");
	format_flt(detail, speed, 0);
	format(detail, "x realtime");
	report(speed >= 200.0, "speed", detail);
}
