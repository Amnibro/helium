fn refs(name const byte[:], out f32[>..]&) bool {
	out.clear();
	var path byte[>..] = [];
	path.append(dir);
	path.push('/');
	path.append(name);
	path.append(".f32");
	var bytes byte[>..] = [];
	if !read_file(path, bytes) { return false; }
	let n = bytes.len / 4;
	for i in n {
		out.push(binary::read_f32le(bytes, i * 4));
	}
