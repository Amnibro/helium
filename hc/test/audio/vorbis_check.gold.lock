import codec_vorbis;
var blob byte[>..];
var offs int[>..];
var lens int[>..];
fn file(i int) const byte[:] {
	let a = offs[i];
	blob[a..a + lens[i]]
}
fn sci(out byte[>..]&, v real) {
	var m = v;
	var e = 0;
	if m > 0.0 {
		while m >= 10.0 { m /= 10.0; e++; }
		while m < 1.0 { m *= 10.0; e--; }
		if m >= 9.995 { m = 1.0; e++; }
	} else {
		m = 0.0;
	}
	format_flt(out, m, 2);
	out.push('e');
	out.push(if e < 0 { '-' } else { '+' });
	format_int(out, abs(e), 10, 2, '0');
}
fn v1() {
	let cs = cases();
	for c, i in cs {
		var pcm f32[>..] = [];
		let ch, rate, ok = codec_vorbis::decode(file(i), pcm);
		var want f32[>..] = [];
		let rok = refs(c.name, want);
		var detail byte[>..] = [];
		var pass = false;
		if !ok {
			format(detail, codec_vorbis::error());
		} else if !rok {
			format(detail, "cannot read reference");
		} else if ch != c.channels || rate != c.rate {
			format(detail, "channels/rate ", ch, "/", rate);
		} else if pcm.len != want.len {
			format(detail, "length ", pcm.len, " vs ", want.len);
		} else {
			var md = 0.0;
			pass = true;
			for k in pcm.len {
				let a real = pcm[k];
				let b real = want[k];
				let d = abs(a - b);
				if d > md { md = d; }
				if !(d <= 0.0001) { pass = false; }
			}
			format(detail, pcm.len / ch, " frames, max diff ");
			sci(detail, md);
		}
		report(pass, c.name, detail);
	}
}
