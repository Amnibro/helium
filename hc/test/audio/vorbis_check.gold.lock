var lcg uint = 7;
fn lcg_next() real {
	lcg = lcg * 6364136223846793005 + 1442695040888963407;
	let top = (lcg >> 40) as int;
	top / 8388608.0 - 1.0
}
fn v2() {
	for n in [64, 512, 4096] {
		var x f32[>..] = [];
		for j in n / 2 { x.push(lcg_next() as f32); }
		var defs real[>..] = [];
		var mx = 0.0;
		for i in n {
			var s = 0.0;
			for j in n / 2 {
				let xv real = x[j];
				s += xv * cos(PI / (2.0 * n) * (2.0 * i + 1.0 + n / 2) * (2.0 * j + 1.0));
			}
			defs.push(s);
			if abs(s) > mx { mx = abs(s); }
		}
		var res f32[>..] = [];
		codec_vorbis::imdct_into(x, res);
		var name byte[>..] = [];
		format(name, "imdct", n);
		var detail byte[>..] = [];
		if res.len != n {
			format(detail, "length ", res.len, " vs ", n);
			report(false, name, detail);
		} else {
			var md = 0.0;
			var pass = true;
			let tol = 0.00001 * mx + 0.000001;
			for i in n {
				let r real = res[i];
				let d = abs(defs[i] - r);
				if d > md { md = d; }
				if !(d <= tol) { pass = false; }
			}
			format(detail, "max diff ");
			sci(detail, md);
			report(pass, name, detail);
		}
	}
}
