fn fine(data const byte[:], must_fail bool) bool {
	var pcm f32[>..] = [];
	let ch, rate, ok = codec_vorbis::decode(data, pcm);
	if !ok { return true; }
	if must_fail { return false; }
	if ch < 1 || ch > 255 { return false; }
	if pcm.len % ch != 0 { return false; }
	for v in pcm {
		if !(v >= -1.0 && v <= 1.0) { return false; }
	}
	return true;
}
fn v3() {
	let cs = cases();
	var good = 0;
	var total = 0;
	fn tally(data const byte[:], must bool) {
		total++;
		if fine(data, must) { good++; }
	}
	for c, i in cs {
		let f = file(i);
		let n = f.len;
		tally(f[..n / 2], false);
		tally(f[..min(40, n)], false);
		var d byte[>..] = [];
		if n > 0 {
			d.append(f);
			d[0] = 0x55;
			tally(d, false);
			d.clear();
			d.append(f);
			let m = n / 2;
			d[m] = d[m] ^ 0x5a;
			tally(d, false);
			d.clear();
			d.append(f);
			var k = 50;
			while k < n {
				d[k] = d[k] ^ 0xff;
				k += 97;
			}
			tally(d, false);
		}
		tally(f[..0], true);
	}
	var detail byte[>..] = [];
	format(detail, good, "/", total, " fine");
	report(good == total, "damaged", detail);
}
