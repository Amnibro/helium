fn n6() {
	reset(17);
	var wrong = 0;
	var missed = 0;
	for i in 20000 {
		let p = point();
		let cx = floor(p.x) as int;
		let cy = floor(p.y) as int;
		let cz = floor(p.z) as int;
		var b1 = 1000000000.0;
		var b2 = 1000000000.0;
		var s1 = 1000000000.0;
		var s2 = 1000000000.0;
		for ox in -3..4 {
			for oy in -3..4 {
				for oz in -3..4 {
					let q, h = noise::cell_point(7, cx + ox, cy + oy, cz + oz);
					let ax = q.x - p.x;
					let ay = q.y - p.y;
					let az = q.z - p.z;
					let d = ax * ax + ay * ay + az * az;
					if d < b1 {
						b2 = b1;
						b1 = d;
					} else if d < b2 {
						b2 = d;
					}
					if abs(ox) <= 1 && abs(oy) <= 1 && abs(oz) <= 1 {
						if d < s1 {
							s2 = s1;
							s1 = d;
						} else if d < s2 {
							s2 = d;
						}
					}
				}
			}
		}
		let e1 = clamp(2.0 * sqrt(b1) - 1.0, -1.0, 1.0);
		let e2 = clamp(sqrt(b2) - 1.0, -1.0, 1.0);
		if abs(noise::base(noise::CELL_F1, 7, p) - e1) > 0.000000000001 || abs(noise::base(noise::CELL_F2, 7, p) - e2) > 0.000000000001 { wrong++; }
		if s2 != b2 { missed++; }
	}
	let d1 = str(wrong, " wrong");
	check(wrong == 0, "N6 cellular F1 and F2 exact", d1);
	let d2 = str(wrong, " wrong, ", missed, " missed by 3x3x3");
	check(missed > 0, "N6 control: a 3x3x3 search misses some", d2);
}
