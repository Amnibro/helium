fn n4() {
	var differ = 0;
	var largest = 0.0;
	for k in 7 {
		reset(13);
		let a = noise::make(k, 7);
		let b = noise::make(k, 7);
		let one = noise::make(k, 1);
		let two = noise::make(k, 2);
		var sx = 0.0;
		var sy = 0.0;
		var sxx = 0.0;
		var syy = 0.0;
		var sxy = 0.0;
		for i in 10000 {
			let p = point();
			if noise::sample(a, p) != noise::sample(b, p) { differ++; }
			let x = noise::sample(one, p);
			let y = noise::sample(two, p);
			sx += x;
			sy += y;
			sxx += x * x;
			syy += y * y;
			sxy += x * y;
		}
		let mx = sx / 10000.0;
		let my = sy / 10000.0;
		let vx = sxx / 10000.0 - mx * mx;
		let vy = syy / 10000.0 - my * my;
		let corr = if vx <= 0.0 || vy <= 0.0 { 0.0 } else { (sxy / 10000.0 - mx * my) / sqrt(vx * vy) };
		largest = max(largest, abs(corr));
	}
	let d1 = str(differ, " differ");
	check(differ == 0, "N4 same seed, same values", d1);
	let d2 = str("largest ", r4(largest));
	check(largest < 0.05, "N4 seeds independent", d2);
}
