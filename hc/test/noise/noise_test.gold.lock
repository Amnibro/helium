fn rough(oct int) real {
	var n = noise::make(noise::PERLIN, 7);
	n.fractal = noise::FBM;
	n.octaves = oct;
	reset(23);
	var diff = 0.0;
	var sum = 0.0;
	var sq = 0.0;
	for i in 10000 {
		let p = point();
		let u = dir();
		let q = double3 { x: p.x + u.x * 0.01, y: p.y + u.y * 0.01, z: p.z + u.z * 0.01 };
		let v = noise::sample(n, p);
		diff += abs(noise::sample(n, q) - v);
		sum += v;
		sq += v * v;
	}
	let mean = sum / 10000.0;
	(diff / 10000.0) / sqrt(max(sq / 10000.0 - mean * mean, 0.0))
}
