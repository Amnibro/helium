fn n3() {
	var worst = 0.0;
	var jump = 0.0;
	for k in 7 {
		reset(11);
		let n = noise::make(k, 7);
		var biggest = 0.0;
		for i in 100000 {
			let p = point();
			let u = dir();
			let q = double3 { x: p.x + u.x * 0.00001, y: p.y + u.y * 0.00001, z: p.z + u.z * 0.00001 };
			biggest = max(biggest, abs(noise::sample(n, p) - noise::sample(n, q)));
		}
		if k == noise::CELL_VALUE {
			jump = biggest;
		} else {
			worst = max(worst, biggest);
		}
	}
	let d1 = str("largest ", worst);
	check(worst < 0.001, "N3 continuous", d1);
	let d2 = str("largest ", r4(jump));
	check(jump > 0.1, "N3 control: cell value jumps", d2);
}
