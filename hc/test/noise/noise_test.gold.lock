fn n1_n2() {
	var outside = 0;
	var means = [0.0; 7];
	var devs = [0.0; 7];
	var raw_out = 0;
	var largest = 0.0;
	for k in 7 {
		reset(7);
		let n = noise::make(k, 7);
		var sum = 0.0;
		var sq = 0.0;
		for i in 100000 {
			let v = noise::sample(n, point());
			if v < -1.0 || v > 1.0 { outside++; }
			sum += v;
			sq += v * v;
		}
		let mean = sum / 100000.0;
		let dev = sqrt(max(sq / 100000.0 - mean * mean, 0.0));
		means[k] = mean;
		devs[k] = dev;
		print(NAMES[k], " mean ", r4(mean), " std ", r4(dev));
		if k == noise::PERLIN {
			reset(7);
			for i in 100000 {
				let v = noise::perlin3(7, point());
				if v < -1.0 || v > 1.0 { raw_out++; }
				largest = max(largest, abs(v));
			}
		}
	}
	let d1 = str(outside, " outside");
	check(outside == 0, "N1 every sample in [-1, 1]", d1);
	let d2 = str(raw_out, " outside, largest ", r4(largest));
	check(raw_out < 100, "N1 raw perlin rarely clamps", d2);
	var balanced = true;
	var d3 byte[>..] = [];
	for k in 3 {
		if !(abs(means[k]) < 0.05 && devs[k] >= 0.1 && devs[k] <= 0.6) { balanced = false; }
		format(d3, NAMES[k], " mean ", r4(means[k]), " std ", r4(devs[k]), " ");
	}
	check(balanced, "N2 value, perlin and simplex balanced", d3);
	var vary = true;
	var d4 byte[>..] = [];
	for k in 3..7 {
		if !(devs[k] > 0.1) { vary = false; }
		format(d4, NAMES[k], " std ", r4(devs[k]), " ");
	}
	check(vary, "N2 cellular kinds vary", d4);
}
