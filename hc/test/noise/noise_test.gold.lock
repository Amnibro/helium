var RS u64 = 0;
fn reset(s int) {
	RS = s as! u64;
}
fn rnd() real {
	RS += noise::GOLDEN64;
	noise::unit_of(noise::mix64(RS))
}
fn point() double3 {
	let x = 100.0 * rnd() - 50.0;
	let y = 100.0 * rnd() - 50.0;
	let z = 100.0 * rnd() - 50.0;
	double3 { x: x, y: y, z: z }
}
fn dir() double3 {
	var x = 0.0;
	var y = 0.0;
	var z = 0.0;
	var l = 0.0;
	while l < 0.01 {
		x = 2.0 * rnd() - 1.0;
		y = 2.0 * rnd() - 1.0;
		z = 2.0 * rnd() - 1.0;
		l = sqrt(x * x + y * y + z * z);
	}
	double3 { x: x / l, y: y / l, z: z / l }
}
