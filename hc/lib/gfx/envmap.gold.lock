fn filter(raw gfx::Texture, n int) {
	if cube.id == 0 || lv != levels(n) {
		if cube.id != 0 { gfx::release(cube); }
		lv = levels(n);
		cube = gfx::texture(gfx::TextureDesc { kind: gfx::TEXTURE_CUBE, format: gfx::RGBA16F, usage: gfx::SAMPLED | gfx::COLOR_TARGET, width: n as i32, height: n as i32, mips: lv as i32 });
	}
	for m in 0..lv {
		var rough f32 = m as f32 / (lv - 2) as f32;
		var count f32 = samples as f32;
		if m == lv - 1 {
			rough = -1.0;
			count = 2048.0;
		} else if m == 0 {
			rough = 0.0;
		}
		faces(cube, m, pipe_ggx, raw, smp, rough, count, n as f32);
	}
}
