	var mips = 0;
	var x = size;
	while x >= 1 { mips++; x /= 2; }
	let raw = gfx::texture(gfx::TextureDesc { kind: gfx::TEXTURE_CUBE, format: gfx::RGBA16F, usage: gfx::SAMPLED | gfx::COLOR_TARGET, width: size as i32, height: size as i32, mips: mips as i32 });
	faces(raw, 0, pipe_equi, t, smp_wrap, 0.0, 0.0, 0.0);
	gfx::generate_mips(raw);
	filter(raw, size);
	gfx::release(t);
	gfx::release(raw);
