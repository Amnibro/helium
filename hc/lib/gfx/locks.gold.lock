fn crom(p0 float3, p1 float3, p2 float3, p3 float3, f real) float3 {
	let a = vmul(p1, 2.0);
	let b = vmul(vsub(p2, p0), f);
	let c = vmul(vadd(vsub(vmul(p0, 2.0), vmul(p1, 5.0)), vsub(vmul(p2, 4.0), p3)), f * f);
	let d = vmul(vadd(vsub(vmul(p1, 3.0), p0), vsub(p3, vmul(p2, 3.0))), f * f * f);
	vmul(vadd(vadd(a, b), vadd(c, d)), 0.5)
}
fn lerpdir(a float3, b float3, f real) float3 {
