fn strands(size int, seed int) int {
	var px byte[>..] = [];
	px.resize(size * size * 4, 0);
	for i in size * size {
		px[i * 4] = 224;
		px[i * 4 + 1] = 224;
		px[i * 4 + 2] = 224;
		px[i * 4 + 3] = 0;
	}
	let sz = size as real;
	let n = round(0.75 * sz) as int;
	for j in n {
		let cx = hash01(seed, 4 * j) * sz;
		let wd = 0.6 + hash01(seed, 4 * j + 1);
		let h3 = hash01(seed, 4 * j + 3);
		let len = if h3 < 0.15 { 0.55 + 0.25 * (h3 / 0.15) } else { 0.8 + 0.2 * hash01(seed, 4 * j + 2) };
		let br = 0.75 + 0.25 * h3;
		let reach = ceil(wd + 1.0) as int;
		let x0 = floor(cx) as int;
		for y in size {
			let v = ((y as real) + 0.5) / sz;
			if v < len {
				for xi in x0 - reach..x0 + reach + 1 {
					let xm = xi % size;
					var d = abs((xm as real) + 0.5 - cx);
					d = min(d, sz - d);
					if d <= wd + 1.0 {
						let cov = clamp(wd / 2.0 + 0.5 - d, 0.0, 1.0) * (1.0 - smooth(0.85 * len, len, v));
						let at = (y * size + xm) * 4;
						let cur = (px[at + 3] as real) / 255.0;
						if cov > cur {
							px[at + 3] = bt(cov * 255.0);
							let c = bt(255.0 * br * (0.82 + 0.18 * smooth(0.0, 0.3, v)));
							px[at] = c;
							px[at + 1] = c;
							px[at + 2] = c;
						}
					}
				}
			}
		}
	}
	for y in size {
		for x in size {
			let u = ((x as real) + 0.5) / sz;
			let at = (y * size + x) * 4;
			px[at + 3] = bt((px[at + 3] as real) * smooth(0.0, 0.08, u) * smooth(0.0, 0.08, 1.0 - u));
		}
	}
	gltf::add_texture_rgba(px, size, size, 10497)
}
