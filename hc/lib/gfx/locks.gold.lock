fn mesh(m gltf::Material) int {
	let v0 = gltf::verts.len / gltf::VERTEX_FLOATS;
	let i0 = gltf::indices.len;
	var lo = float3 { 1e30, 1e30, 1e30 };
	var hi = float3 { -1e30, -1e30, -1e30 };
	let nv = P.len / 3;
	for i in nv {
		let p = float3 { P[3 * i], P[3 * i + 1], P[3 * i + 2] };
		let n = float3 { N[3 * i], N[3 * i + 1], N[3 * i + 2] };
		let t = float4 { T[3 * i], T[3 * i + 1], T[3 * i + 2], 1.0 };
		shapes::vertex(p, n, UV[2 * i], UV[2 * i + 1], t);
		lo = float3 { min(lo.x, p.x), min(lo.y, p.y), min(lo.z, p.z) };
		hi = float3 { max(hi.x, p.x), max(hi.y, p.y), max(hi.z, p.z) };
	}
	for k in I.len {
		gltf::indices.push(I[k]);
	}
	shapes::finish(v0, i0, lo, hi, m)
}
