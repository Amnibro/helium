fn wear(item int, joint const byte[:], meshes const byte[][:], name const byte[:], shade const byte[:], seed int) int {
	let a = s3d::items[item].asset;
	if !measure(a, joint, meshes) { return -1; }
	let st = style(name);
	var data byte[>..] = [];
	let made = grow(st, seed, data);
	if made == 0 { return -1; }
	let g = hair::load(data, st.strands);
	if g < 0 { return -1; }
	let sh = tone(shade);
	hair::grooms[g].look.color = float3 { sh.r, sh.g, sh.b };
	hair::grooms[g].look.gain = sh.gain;
	hair::grooms[g].look.roughness = st.rough;
	hair::grooms[g].look.frizz = st.frizz;
	hair::grooms[g].look.dye = sh.dye;
	hair::grooms[g].look.ambient = float3 { 1.2, 1.2, 1.2 };
	if st.length < 1.2 && st.tie == 0 {
		hair::grooms[g].phys.tip = 0.6;
	} else {
		hair::grooms[g].phys.tip = 0.1;
	}
	hair::grooms[g].phys.bend = 0.25 + 0.5 * st.stiff;
	hair::follow(g, item, gltf::find_node(a, joint));
	return g;
}
