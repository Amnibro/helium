fn radius(d float3) f32 {
	if map.len < MW * MH { return unit; }
	let fx = (atan2(d.x as real, d.z as real) / 6.2831853 + 0.5) * MW - 0.5;
	let fy = (asin_r(clamp(d.y, -1.0, 1.0) as real) / 3.14159265 + 0.5) * MH - 0.5;
	let x0 = floor(fx);
	let y0 = floor(fy);
	let tx = (fx - x0) as f32;
	let ty = (fy - y0) as f32;
	let xa = ((x0 as int) % MW + MW) % MW;
	let xb = ((x0 as int) + 1 + MW) % MW;
	let ya = clamp(y0 as int, 0, MH - 1);
	let yb = clamp((y0 as int) + 1, 0, MH - 1);
	let top_row = mix(map[ya * MW + xa], map[ya * MW + xb], tx);
	let bot_row = mix(map[yb * MW + xa], map[yb * MW + xb], tx);
	mix(top_row, bot_row, ty)
}
