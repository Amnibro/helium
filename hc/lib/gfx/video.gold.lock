		let h2 = height / 2;
		let cstride = cw / 2;
		for y in h2 { for x in w2 { recon.push(ru[y * cstride + x] as! byte); } }
		for y in h2 { for x in w2 { recon.push(rv[y * cstride + x] as! byte); } }
