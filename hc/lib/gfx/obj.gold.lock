import math;
fn normals(idx const int[:], out f32[>..]&) {
	out.clear();
	var acc real[>..] = [];
	acc.resize(V.len, 0.0);
	let nv = V.len / 3;
	for t in idx.len / 3 {
		let a = idx[t * 3];
		let b = idx[t * 3 + 1];
		let c = idx[t * 3 + 2];
		if a < 0 || b < 0 || c < 0 || a >= nv || b >= nv || c >= nv { continue; }
		let e1x = V[b * 3] - V[a * 3];
		let e1y = V[b * 3 + 1] - V[a * 3 + 1];
		let e1z = V[b * 3 + 2] - V[a * 3 + 2];
		let e2x = V[c * 3] - V[a * 3];
		let e2y = V[c * 3 + 1] - V[a * 3 + 1];
		let e2z = V[c * 3 + 2] - V[a * 3 + 2];
		let cx = e1y * e2z - e1z * e2y;
		let cy = e1z * e2x - e1x * e2z;
		let cz = e1x * e2y - e1y * e2x;
		for j in 0..3 {
			var v = a;
			if j == 1 { v = b; }
			if j == 2 { v = c; }
			acc[v * 3] += cx;
			acc[v * 3 + 1] += cy;
			acc[v * 3 + 2] += cz;
		}
	}
	for v in nv {
		let x = acc[v * 3];
		let y = acc[v * 3 + 1];
		let z = acc[v * 3 + 2];
		let l = sqrt(x * x + y * y + z * z);
		if l < 1e-20 {
			out.push(0.0);
			out.push(1.0);
			out.push(0.0);
		} else {
			out.push((x / l) as f32);
			out.push((y / l) as f32);
			out.push((z / l) as f32);
		}
	}
}
