fn centroid(name const byte[:]) real, real, real {
	let g = group(name);
	if g < 0 { return 0.0, 0.0, 0.0; }
	var seen byte[>..] = [];
	seen.resize(V.len / 3, 0);
	var sx = 0.0;
	var sy = 0.0;
	var sz = 0.0;
	var n = 0;
	for t in tris.len / 4 {
		if tris[t * 4] == g {
			for j in 1..4 {
				let v = tris[t * 4 + j];
				if v >= 0 && v < seen.len && seen[v] == 0 {
					seen[v] = 1;
					sx += V[v * 3];
					sy += V[v * 3 + 1];
					sz += V[v * 3 + 2];
					n++;
				}
			}
		}
	}
	if n == 0 { return 0.0, 0.0, 0.0; }
	return sx / n, sy / n, sz / n;
}
