fn make(asset int, keep f32) int {
	if keep >= 1.0 { return asset; }
	let source = gltf::assets[asset];
	var copied = gltf::assets[asset];
	let mesh_first = gltf::meshes.len;
	for i in source.meshes.count {
		var mesh = gltf::meshes[source.meshes.first + i];
		let old_prims = mesh.prims;
		mesh.prims.first = gltf::prims.len;
		for j in old_prims.count {
			var prim = gltf::prims[old_prims.first + j];
			let index_count = prim.icount as int;
			let count = index_count / 3;
			let target = max(12, round((count as real) * (keep as real)) as int);
			if !(prim.skinned || prim.targets > 0 || count <= target) {
				var low u32[>..] = [];
				let first_index = prim.ifirst as int;
				let vertex_count = prim.vcount as int;
				let vf = gltf::VERTEX_FLOATS as int;
				let first_float = (prim.vfirst as int) * vf;
				reduce(gltf::indices[first_index..first_index + index_count], gltf::verts[first_float..first_float + vertex_count * vf], vf, gltf::AT_POS, vertex_count, target, low);
				prim.ifirst = gltf::indices.len;
				prim.icount = low.len;
				gltf::indices.append(low);
			}
			gltf::prims.push(prim);
		}
		gltf::meshes.push(mesh);
	}
	let node_first = gltf::nodes.len;
	let node_shift = node_first - source.nodes.first;
	for i in source.nodes.count {
		var node = gltf::nodes[source.nodes.first + i];
		if node.mesh != -1 { node.mesh = node.mesh - source.meshes.first + mesh_first; }
		if node.parent != -1 { node.parent = node.parent + node_shift; }
		let children = node.children;
		node.children.first = gltf::ints.len;
		for j in children.count {
			let child = gltf::ints[children.first + j];
			gltf::ints.push(child + node_shift);
		}
		gltf::nodes.push(node);
	}
	copied.roots.first = gltf::ints.len;
	for i in source.roots.count {
		let root = gltf::ints[source.roots.first + i];
		gltf::ints.push(root + node_shift);
	}
	copied.meshes.first = mesh_first;
	copied.nodes.first = node_first;
	copied.ok = true;
	gltf::assets.push(copied);
	gltf::assets.len - 1
}
