fn mix(k int) int {
	let factor uint = 0x9E3779B97F4A7C15;
	let x = (k as! uint) * factor;
	let mask uint = 0x7FFFFFFFFFFFFFFF;
	((x ^ (x >> 29)) & mask) as! int
}
