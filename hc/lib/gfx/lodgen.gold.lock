fn reduce(tris const u32[:], pos const f32[:], stride int, at int, nv int, target int, out u32[>..]&) int {
	out.clear();
	let ntri = tris.len / 3;
	if ntri <= target || target < 1 {
		out.append(tris);
		return ntri;
	}
	var lo = 1;
	var hi = 1024;
	var rounds = 0;
	while lo < hi && rounds < 11 {
		let mid = (lo + hi + 1) / 2;
		if grid_pass(tris, pos, stride, at, nv, mid, out) <= target { lo = mid; } else { hi = mid - 1; }
		rounds++;
	}
	let made = grid_pass(tris, pos, stride, at, nv, lo, out);
	if made == 0 {
		out.clear();
		out.append(tris);
		return ntri;
	}
	made
}
