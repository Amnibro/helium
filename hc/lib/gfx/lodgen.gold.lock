fn tris(asset int) int {
	let span = gltf::assets[asset].meshes;
	var total = 0;
	for i in span.count {
		let prims = gltf::meshes[span.first + i].prims;
		for j in prims.count { total += (gltf::prims[prims.first + j].icount as int) / 3; }
	}
	total
}
