fn step(w physics::World&, m Mover&, wish float3, jump bool, dt f32) {
	let was = m.grounded;
	var h = float3 { m.vel.x, 0.0, m.vel.z };
	if was {
		let speed = sqrt(h.x * h.x + h.z * h.z) as f32;
		if speed < 0.01 {
			h = float3 { 0.0, 0.0, 0.0 };
		} else {
			let scale = max(speed - max(speed, m.s.stop_speed) * m.s.friction * dt, 0.0) / speed;
			h = float3 { h.x * scale, h.y * scale, h.z * scale };
		}
	}
	let wish_len = sqrt(wish.x * wish.x + wish.z * wish.z) as f32;
	let length = min(wish_len, 1.0);
	if length > 0.0001 {
		let dx = wish.x / wish_len;
		let dz = wish.z / wish_len;
		let desired = m.s.max_speed * length;
		let add = desired - (h.x * dx + h.z * dz);
		if add > 0.0 {
			let steer f32 = if was { 1.0 } else { m.s.air_steer };
			let gain = min(add, m.s.accelerate * m.s.max_speed * dt * steer);
			h.x = h.x + dx * gain;
			h.z = h.z + dz * gain;
		}
	}
	m.vel.x = h.x;
	m.vel.z = h.z;
	if was && jump {
		m.vel.y = m.s.jump_speed;
		m.grounded = false;
	} else if was {
		m.vel.y = 0.0;
	} else {
		m.vel.y = m.vel.y - m.s.gravity * dt;
	}
	slide(w, m, float3 { m.vel.x * dt, m.vel.y * dt, m.vel.z * dt }, was && !jump);
	let hit, dy, n = probe(w, m);
	let down f32 = if was && !jump { m.s.step_height * 2.0 } else { 0.02 };
	if hit && walkable(n, m.s) && m.vel.y <= 0.0 && dy >= 0.0 - down && dy <= m.s.step_height + 0.1 * m.s.radius {
		m.grounded = true;
		m.ground_normal = n;
		m.vel.y = 0.0;
		let lift = if dy > 0.0 && was { min(dy, m.s.rise_speed * dt) } else { dy };
		let f = physics::cast_mover(w, m.pos, capsule(m), float3 { 0.0, lift, 0.0 }, m.s.filter);
		m.pos.y = m.pos.y + lift * f;
	} else {
		m.grounded = false;
		m.ground_normal = float3 { 0.0, 1.0, 0.0 };
	}
}
