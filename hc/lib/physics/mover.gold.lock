fn capsule(m Mover&) physics::Capsule {
	physics::Capsule { center1: float3 { 0.0, m.s.step_height + m.s.radius, 0.0 }, center2: float3 { 0.0, m.s.height - m.s.radius, 0.0 }, radius: m.s.radius + m.s.skin }
}
