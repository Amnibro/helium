fn gather(w physics::World&, m Mover&, standing bool) {
	m.planes.clear();
	let found = physics::collide_mover(w, m.pos, capsule(m), m.s.filter);
	for h in found {
		var plane = h.plane;
		if standing && !walkable(plane.normal, m.s) && plane.normal.y > 0.0 {
			let nx = plane.normal.x;
			let nz = plane.normal.z;
			let len = sqrt(nx * nx + nz * nz) as f32;
			if len > 0.0001 {
				plane.normal = float3 { nx / len, 0.0, nz / len };
				plane.offset = plane.offset / len;
			}
		}
		m.planes.push(physics::CollisionPlane { plane: plane, push_limit: 3.4e38, push: 0.0, clip_velocity: true });
	}
}
