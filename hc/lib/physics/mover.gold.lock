fn slide(w physics::World&, m Mover&, delta float3, standing bool) {
	let target = m.pos + delta;
	for round in 5 {
		gather(w, m, standing);
		let solved, iterations = physics::solve_planes(target - m.pos, m.planes[..]);
		if !standing { solved.y = min(solved.y, max(0.0, target.y - m.pos.y)); }
		let f = physics::cast_mover(w, m.pos, capsule(m), solved, m.s.filter);
		let moved = float3 { solved.x * f, solved.y * f, solved.z * f };
		m.pos = m.pos + moved;
		if sqrt(moved.x * moved.x + moved.y * moved.y + moved.z * moved.z) < 0.001 { break; }
	}
	m.vel = physics::clip_vector(m.vel, m.planes[..]);
	m.hits = m.planes.len;
}
