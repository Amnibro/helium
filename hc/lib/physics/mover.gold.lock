fn probe(w physics::World&, m Mover&) bool, f32, float3 {
	let points = [float3 { 0.0, m.s.step_height + m.s.radius, 0.0 }];
	let reach = m.s.step_height * 3.0 + 0.1 * m.s.radius;
	let found = physics::cast_shape(w, m.pos, points[..], 0.9 * m.s.radius, float3 { 0.0, 0.0 - reach, 0.0 }, m.s.filter);
	if found.len == 0 { return false, 0.0, float3 { 0.0, 1.0, 0.0 }; }
	let n = found[0].normal;
	let p = found[0].point;
	let ground = if n.y > 0.1 { p.y - (n.x * (m.pos.x - p.x) + n.z * (m.pos.z - p.z)) / n.y } else { p.y };
	return true, ground - m.pos.y, n;
}
