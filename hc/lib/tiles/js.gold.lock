num_str(x real) byte[>..]:
	out byte[>..] ~= []
	if is_nan(x): out.append("NaN"); return out
	if x == 0.0: out.append("0"); return out
	if is_inf(x):
		if x < 0.0: out.append("-Infinity") else: out.append("Infinity")
		return out
	if x < 0.0: out.push('-')
	digits byte[>..] ~= []
	e := json::digits_of(fabs(x), digits)
	k := digits.len
	n := e + 1
	if n >= 1 && n <= 21:
		if k <= n:
			out.append(digits)
			for i n - k: out.push('0')
		else:
			out.append(digits[..n])
			out.push('.')
			out.append(digits[n..])
	else if n >= -5 && n <= 0:
		out.append("0.")
		for i -n: out.push('0')
		out.append(digits)
	else:
		out.push(digits[0])
		if k > 1:
			out.push('.')
			out.append(digits[1..])
		out.push('e')
		m := n - 1
		if m < 0: out.push('-'); m = -m else: out.push('+')
		format(out, m)
	return out
