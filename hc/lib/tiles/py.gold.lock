			else if !(pos - 1 > 0 && addr[pos - 1] == 92):
				commas += count_commas(addr, start, op)
				start = pos + 1
				op = -1
	if start < addr.len: commas += count_commas(addr, start, addr.len)
	1 + commas
getaddresses(header const byte[:], names byte[>..][>..]&, addrs byte[>..][>..]&):
	t1 byte[>..] ~= []
	strip_esc(header, 40, t1)
	t2 byte[>..] ~= []
	strip_esc(t1, 41, t2)
	opens ~= 0
	closes ~= 0
	for c t2:
		if c == 40: opens += 1
		if c == 41: closes += 1
	if opens != closes:
		add_pair(names, addrs, "", "")
		return
	n0 := names.len
	ad_parse(header, names, addrs)
	got := names.len - n0
	if got != expected_count(header):
		names.pop_n(got)
		addrs.pop_n(got)
		add_pair(names, addrs, "", "")
	return
