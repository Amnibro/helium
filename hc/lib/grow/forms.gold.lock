fn scatter(cx real, cz real, radius real, count int, gap real) {
	S.clear();
	for attempt in count * 37 {
		if S.len >= count * 2 { break; }
		let r = radius * sqrt(rnd());
		let a = PI2 * rnd();
		let x = cx + r * cos(a);
		let z = cz + r * sin(a);
		var free = true;
		for k in S.len / 2 {
			let dx = S[k * 2] - x;
			let dz = S[k * 2 + 1] - z;
			if dx * dx + dz * dz < gap * gap {
				free = false;
				break;
			}
		}
		if free {
			S.push(x);
			S.push(z);
		}
	}
}
