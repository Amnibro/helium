fn on_surface(t0 int, count int, min_up real) {
	S.clear();
	var sums real[>..] = [];
	var ids int[>..] = [];
	var total = 0.0;
	for t in t0..tcount() {
		let a = pos(I[t * 3] as int);
		let e = pos(I[t * 3 + 1] as int) - a;
		let f = pos(I[t * 3 + 2] as int) - a;
		let cr = cross(e, f);
		let l = length(cr);
		if l > 0.0 && cr.y / l >= min_up {
			total += 0.5 * l;
			sums.push(total);
			ids.push(t);
		}
	}
	if ids.len == 0 { return; }
	for k in count {
		let want = rnd() * total;
		var lo = 0;
		var hi = ids.len - 1;
		while lo < hi {
			let mid = (lo + hi) / 2;
			if sums[mid] < want { lo = mid + 1; } else { hi = mid; }
		}
		let t = ids[lo];
		let a = pos(I[t * 3] as int);
		let e = pos(I[t * 3 + 1] as int) - a;
		let f = pos(I[t * 3 + 2] as int) - a;
		var u = rnd();
		var v = rnd();
		if u + v > 1.0 {
			u = 1.0 - u;
			v = 1.0 - v;
		}
		let p = a + e * u + f * v;
		S.push(p.x);
		S.push(p.y);
		S.push(p.z);
	}
}
