fn make(kind const byte[:], s int, size real) bool {
	clear();
	seed(s);
	let origin = double3 { 0.0, 0.0, 0.0 };
	if kind == "rock" {
		rock(origin, size);
	} else if kind == "shell" {
		shell(origin, size);
	} else if kind == "mushroom" {
		mushroom(origin, size);
	} else if kind == "cactus" {
		cactus(origin, size);
