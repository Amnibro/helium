fn leaf(b double3, dir double3, up double3, len real, width real, curl real, fold real, segs int, c double3) int {
	let v0 = vcount();
	let t0 = tcount();
	let d = unit(dir);
	let side = unit(cross(d, up));
	let n = cross(side, d);
	let mid_col = c * 0.82;
	let edge_col = tint(c, 0.07);
	for r in segs + 1 {
		let u = (r as real) / (segs as real);
		var mid = b + d * (len * u);
		var ln = n;
		if curl >= 0.0001 || curl <= -0.0001 {
			mid = b + (d * (sin(curl * u) / curl) - n * ((1.0 - cos(curl * u)) / curl)) * len;
			ln = rot(n, side, -curl * u);
		}
		let hw = 0.5 * width * pow(max(sin(PI * pow(u, 0.7)), 0.0), 0.8);
		let light = 1.0 + 0.15 * u;
		for k in 3 {
			let across = (k - 1) as real;
			let p = mid + side * (across * hw) + ln * (fold * abs(across) * hw);
			let shade = if k == 1 { mid_col } else { edge_col };
			vert(p, ln, shade * light);
		}
	}
	for r in segs {
		for k in 2 {
			let a = v0 + r * 3 + k;
			quad(a, a + 1, a + 4, a + 3);
