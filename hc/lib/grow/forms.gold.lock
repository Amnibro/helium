fn fern(b double3, size real) {
	let green = double3 { 0.15, 0.40, 0.10 };
	let up = double3 { 0.0, 1.0, 0.0 };
	let turn = PI2 * rnd();
	for frond in 7 {
		let a = turn + PI2 * frond / 7.0 + range(-0.25, 0.25);
		let out = double3 { cos(a), 0.0, sin(a) };
		let elev = range(55.0, 70.0) * PI / 180.0;
		let curl = range(0.9, 1.3);
		let l = vary(size, 0.1);
		var path double3[9] = [double3 { 0.0, 0.0, 0.0 }; 9];
		var radii real[9] = [0.0; 9];
		var cols double3[9] = [double3 { 0.0, 0.0, 0.0 }; 9];
		var p = b;
		for k in 9 {
			path[k] = p;
			radii[k] = 0.006 * size;
			cols[k] = green;
			let e = elev - curl * (k + 0.5) / 8.0;
			p = p + (out * cos(e) + up * sin(e)) * (l / 8.0);
		}
		tube(path, radii, cols, 5, true);
		for j in 17 {
			let t = 0.12 + 0.85 * j / 16.0;
			let along = t * 8.0;
			let i = min(along as int, 7);
			let at = path[i] + (path[i + 1] - path[i]) * (along - i);
			let ahead = unit(path[i + 1] - path[i]);
			let side = unit(cross(ahead, up));
			let face = cross(side, ahead);
			let pl = 0.26 * l * sin(PI * pow(t, 0.8));
			for s in 2 {
				let hand = if s == 0 { -1.0 } else { 1.0 };
				let pd = unit(side * hand + ahead * 0.35);
				leaf(at, pd, face, pl, 0.22 * pl, 0.3, 0.2, 4, tint(green * (1.0 + 0.6 * t), 0.08));
