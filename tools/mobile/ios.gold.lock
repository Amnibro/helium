fn quote(s const byte[:]) byte[>..] {
	var r byte[>..] = [];
	r.push('\'');
	for c in s {
		if c == '\'' {
			r.append("'\\''");
		} else {
			r.push(c);
		}
	}
	r.push('\'');
	r
}
fn define_val(text const byte[:], name const byte[:], out byte[>..]&) bool {
	let idx = find(text, name);
	if idx < 0 {
		return false;
	}
	let start = idx + name.len;
	var e = start;
	while e < text.len && text[e] != '\n' { e += 1; }
	out.append(trim(text[start..e]));
	true
}
