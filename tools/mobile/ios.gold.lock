		return [];
	}
	var a byte[>..] = [];
	var b byte[>..] = [];
	var c byte[>..] = [];
	if !define_val(text, "#define SDL_MAJOR_VERSION", a) { return []; }
	if !define_val(text, "#define SDL_MINOR_VERSION", b) { return []; }
	if !define_val(text, "#define SDL_MICRO_VERSION", c) { return []; }
	str(a, ".", b, ".", c)
}
