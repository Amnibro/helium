fn fill(t const byte[:], key const byte[:], value const byte[:]) byte[>..] {
	var r byte[>..] = [];
	if key.len == 0 {
		r.append(t);
		return r;
	}
	var i = 0;
	while i < t.len {
		if starts_with(t[i..], key) {
			r.append(value);
			i += key.len;
		} else {
			r.push(t[i]);
			i += 1;
		}
	}
	r
}
