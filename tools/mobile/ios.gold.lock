fn mac_build(o Opts, w const byte[:]) bool {
	let v = sdl_version(o.sdl);
	if v.len == 0 {
		print("ios: no SDL source at ", o.sdl);
		return false;
	}
	if !mac_sdl(copy(o), v) {
		return false;
	}
	let d = str(MAC_B, "/", o.id);
	if !sh("upload", rsync_cmd("--exclude build --exclude sdl --exclude '*.xcodeproj'", str(w, "/"), o.mac, d)) {
		return false;
	}
	let proj = str("cd ", quote(d), " && ln -s -f -n ", quote(str("../sdl-", v)), " sdl && xcodegen generate -q");
	if !sh("project", ssh_cmd(o.mac, proj)) {
		return false;
	}
	if o.release.len > 0 {
		if !sh("release", ssh_cmd(o.mac, str("nice -n 10 ~/build/amni-ios-release/release.sh ", quote(o.release)))) {
			return false;
		}
		print("ios: ", o.name, " sent to TestFlight");
		return true;
	}
	let xb = str("cd ", quote(d), " && nice -n 10 xcodebuild build -project ", quote(str(o.name, ".xcodeproj")), " -scheme ", quote(o.name), " -destination generic/platform=iOS -configuration Release -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO -quiet");
	if !sh("build", ssh_cmd(o.mac, xb)) {
		return false;
	}
	print("ios: built ", d, "/build/dd/Build/Products/Release-iphoneos/", o.name, ".app (unsigned) on ", o.mac);
	true
}
