fn main() {
	let o = opts_of();
	if !o.ok {
		print("usage: ios MAIN.amni --name NAME --id com.example.app [--assets DIR] [--icons DIR.xcassets] [--ver 1.0.0] [--team TEAMID] [--out DIR] [--portrait] [--mac HOST [--release CASE]]");
		return;
	}
	let w = stage(copy(o));
	if w.len == 0 {
		return;
	}
	if o.mac.len == 0 {
		print("ios: staged ", w, " (run with --mac HOST to build it on a Mac with Xcode, xcodegen, cmake and ninja)");
		return;
	}
	mac_build(copy(o), w);
}
