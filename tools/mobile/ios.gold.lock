fn project_yml(o Opts) byte[>..] {
	var t byte[>..] = [];
	if !read_file(str(o.root, "/tools/mobile/ios/project.yml.in"), t) {
		return [];
	}
	var prefix = o.id[..];
	var last = -1;
	for c, i in o.id {
		if c == '.' { last = i; }
	}
	if last >= 0 { prefix = o.id[..last]; }
	var r = fill(t, "@NAME@", o.name);
	var r2 = fill(r, "@ID@", o.id);
	var r3 = fill(r2, "@PREFIX@", prefix);
	var r4 = fill(r3, "@TEAM@", o.team);
	var r5 = fill(r4, "@VER@", o.ver);
	let orient = if o.portrait { "[UIInterfaceOrientationPortrait]" } else { "[UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]" };
	fill(r5, "@ORIENT@", orient)
}
