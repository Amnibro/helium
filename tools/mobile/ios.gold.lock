fn stage(o Opts) byte[>..] {
	let w = str(o.out, "/", o.id);
	let qw = quote(w);
	if !sh("staging", str("rm -rf ", qw, " && mkdir -p ", quote(str(w, "/src")), " ", quote(str(w, "/assets")), " ", quote(str(w, "/app")))) {
		return [];
	}
	let mdir = dir_of(o.main);
	let mbase = base_of(o.main);
	if !sh("compiling", str("cd ", quote(mdir), " && HC_LIB=", quote(str(o.root, "/hc/lib")), " ", quote(o.hcn), " ", quote(mbase), " ", quote(str(w, "/src/main.c")), " --static")) {
		return [];
	}
	if !sh("runtime", str("cp ", quote(str(o.root, "/hc/hrt.h")), " ", quote(str(o.root, "/tools/mobile/ios/helium_ios.c")), " ", quote(str(w, "/src")))) {
		return [];
	}
	if o.assets.len > 0 {
		if !sh("assets", str("cp -R ", quote(str(o.assets, "/.")), " ", quote(str(w, "/assets")))) {
			return [];
		}
	}
	if o.icons.len > 0 {
		if !sh("icons", str("cp -R ", quote(o.icons), " ", quote(str(w, "/app/Assets.xcassets")))) {
			return [];
		}
	}
	let y = project_yml(copy(o));
	if y.len == 0 || !write_file(str(w, "/project.yml"), y) {
		print("ios: project.yml failed");
		return [];
	}
	w
}
